version: "3.8"

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: resumeforge-backend
    volumes:
      - ./data:/app/data
    networks:
      - resume-net
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: resumeforge-frontend
    ports:
      - "3000:3000"
    depends_on:
      - backend
    networks:
      - resume-net
    restart: unless-stopped

networks:
  resume-net:
    driver: bridge
